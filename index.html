<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lamech Dete | Senior Software Engineer & Tech Mentor</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.css"
    />
    <link rel="stylesheet" href="./dist/css/styles.css" />
  </head>
  <body>
    <!-- Header Component -->
    <div id="header"></div>

    <div class="container">
      <!-- Profile Info Component -->
      <div id="profile-info"></div>

      <div class="main-content">
        <!-- Sidebar Component -->
        <div id="sidebar"></div>

        <main class="content">
          <!-- Experience Component -->
          <div id="experience"></div>

          <!-- Projects Component -->
          <div id="projects"></div>

          <!-- Challenges Component -->
          <div id="challenges"></div>

          <!-- Mentorship Component -->
          <div id="mentorship"></div>
        </main>
      </div>
    </div>

    <!-- Footer Component -->
    <div id="footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.js"></script>
    <script src="./dist/js/script.js"></script>
    <script>
      // Load components
      document.addEventListener("DOMContentLoaded", function () {
        // Array of components to load
        const components = [
          "header",
          "profile-info",
          "sidebar",
          "experience",
          "projects",
          "challenges",
          "mentorship",
          "footer",
        ];

        // Load each component
        const loadPromises = components.map((component) => {
          return fetch(`components/${component}.html`)
            .then((response) => response.text())
            .then((html) => {
              document.getElementById(component).innerHTML = html;
            })
            .catch((error) =>
              console.error(`Error loading ${component}:`, error)
            );
        });

        // After all components are loaded, initialize the challenge drawers
        Promise.all(loadPromises).then(() => {
          // Check if the script.js has initialized the drawers
          if (typeof setupChallengeDrawers === "function") {
            setupChallengeDrawers();
          } else {
            // If not, wait a bit more and try again
            setTimeout(() => {
              if (typeof setupChallengeDrawers === "function") {
                setupChallengeDrawers();
              }
            }, 300);
          }
        });
      });
    </script>
  </body>
</html>
